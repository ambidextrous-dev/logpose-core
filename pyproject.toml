[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "logpose-core"
version = "0.1.0"
description = "Shared database models and provider helpers for Logpose"
requires-python = ">=3.12"
dependencies = [
  "marshmallow>=3.20,<4.0",
  "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
psycopg = ["psycopg[binary]>=3.2,<4.0"]

[tool.setuptools.packages.find]
include = ["logpose_core*"]
